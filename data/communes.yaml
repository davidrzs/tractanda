- bfs_id: 261
  name: Zürich
  canton: ZH
  language: de
  added: 2026-09-06
  website: https://www.gemeinderat-zuerich.ch
  vendor: cmi-paris
  body: parliament
  lat: 47.3769
  lon: 8.5417
  listing_urls:
  - https://www.gemeinderat-zuerich.ch/api/sitzung/searchdetails/
  adapter: paris_api
  adapter_config:
    steps:
    - selector: Dokument
      text_regex: ^Protokoll$
    since_days: 13500  # back to about 1990; the API's first year is not known (David, 2026-11-13)
    max_follow: 80
  sources:
  # Budgets, financial plans (FAP), accounts and annual reports, which the Gemeinderat approves, on
  # the city website. Its pages have no anchors: each link is the href attribute of a custom element.
  # The sitemap lists the publication pages from 2021 on; the two archive pages link 2009 to 2021.
  - adapter: html_links
    vendor: custom
    listing_urls:
    - https://www.stadt-zuerich.ch/de.sitemap.xml
    - https://www.stadt-zuerich.ch/de/politik-und-verwaltung/finanzen/budget/vorjahre.html
    - https://www.stadt-zuerich.ch/de/politik-und-verwaltung/finanzen/rechnung/vorjahre.html
    adapter_config:
      steps:
      - selector: loc
        url_regex: /de/aktuell/publikationen/\d{4}/(budget|fap|rechnung|geschaeftsbericht)-\d{4}(-\d{4})?\.html$
        also_documents: true
        max_follow: 40
      - selector: stzh-datalist-item[meta^='PDF'][href]
        url_attribute: href
