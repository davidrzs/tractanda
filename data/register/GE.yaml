- bfs_id: 6613
  name: Chêne-Bourg
  canton: GE
  status: configured
  website: https://www.chene-bourg.ch
  vendor: iomedia-nuxt
  reachable: true
  checked: 2026-10-19
  checked_by: crawler dry run (unverified)
  notes: Conseil municipal. The broad archive collects the commune's public PDFs (accounts, regulations and council
    pages), untagged (linked-sources.yaml). The allinone.io API is blocked and not used. Configured without the
    robots-blocked allinone.io API. The public sitemap (sitemap.xml, robots.txt Crawl-delay 10) lists one page per
    Conseil municipal session (/seances/seance-du-18-fevrier-2025-340), and each session page is served with its
    documents as plain links to /media/document/0/<file>.pdf. The broad archive collects the commune's public PDFs,
    untagged (linked-sources.yaml).
  publications:
  - body: parliament
    kind: minutes
    status: configured
    listing_url: https://www.chene-bourg.ch/sitemap.xml
    from: '2006-01-13'
    to: '2026-10-01'
    how: 'html_links, 3 hops: sitemap.xml -> sitemap/fr_N.xml -> the session pages (/seances/seance-du-<day>-<month>-<year>-<id>,
      dated by their slug) -> the PDF links on each session page (Ordre du jour, Communications du Conseil administratif,
      Délibérations, Procès-verbal). Each document is dated by its file name (2025-02-18-avis, pv-2025-02-18, communications-du-ca-18-02-2025)
      or else its session. Excluded as contradictory: 20210521-avis (listed under the session of 11.05.2021, after
      it) and the two 20190914 files (no 2019 session in the sitemap). 20201003-avis is kept as the convocation''s
      issue date for the session of 13.10.2020. Future sessions are only collected once held. Dry run: 118 documents
      2020-06-02 to 2026-09-22.'
