  checked_by: crawler dry run (unverified)
  notes: 'The broad archive collects the commune''s public PDFs, untagged (linked-sources.yaml). Earlier address:
    http://www.lantsch-lenz.ch.'
  publications:
  - body: assembly
    kind: minutes
    status: configured
    listing_url: https://www.lantsch-lenz.ch/behoerden/politische-gemeinde/gemeindeversammlungen
    how: 'Gemeindeversammlungen page, two hops: the articles ''Protokoll der Gemeindeversammlung vom ...'' and ''Einladung
      Gemeindeversammlung vom ...'' (step 1, dated by the assembly date in their title), then the PDFs attached
      to each article under /images/pdf/ (step 2): minutes (redacted since 2019: _geschw, _anonym, mit Datenschutz),
      Botschaften, budgets, accounts, finance plans and the laws and contracts put to the assembly 2015-2026. Documents
      take their own date where the file name or link carries one (Finanzplanung ..._GV_06112024, contract ZRSA
      2019-01-01), otherwise the assembly date. The Bürgergemeinde''s own minutes and invitations (Protocol dalla
      radunanza da vaschoins, Einladung Bürgergemeindeversammlung) are left out. Excluded: the Botschaft titled
      23.03.2022 whose file is named for 23.06.2022, the December 2021 brochure listed under the session of 31.10.2021,
      the ''April 04-2022'' brochure listed under 19.04.2023, the Botschaft listed under 26.10.2016 whose file is
      BotschaftGVer30.06.2016, the Erschliessungsgesetz dated by its effective date (ab01012022), and the Mitwirkungsauflage
      and Planungs- und Mitwirkungsbericht files (participation reports summarise residents'' submissions). Dry
      run 175 documents.'
