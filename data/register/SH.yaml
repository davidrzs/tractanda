- bfs_id: 2936
  name: Merishausen
  canton: SH
  status: configured
  website: https://merishausen.ch
  vendor: sh-cms
  reachable: true
  checked: 2026-10-19
  checked_by: crawler dry run (unverified)
  notes: 'Java CMS whose navigation is rendered client-side (9 anchors in the HTML, all backend links); nothing
    to select without JavaScript; browser inspection. The broad archive collects the commune''s public PDFs from
    the download lists of the Schaffhausen cantonal CMS, untagged (linked-sources.yaml). Configured with the sh_cms
    adapter over the Gemeindeversammlung node 8711397 (contentButtonAdder groups Übersicht, Rechnungen, Budgets).
    The earlier blocked_js note is superseded: the JSON node endpoint serves the groups plainly. The 2021-2022 assemblies
    are article nodes (contenttypeid 401) holding only the agenda as text, no files; they are not collected. The
    Rechnungen and Budgets groups are excluded: their file nodes carry no date of their own, so the adapter would
    date them by the CMS publication date. data/linked-sources.yaml keeps its Recht und Gesetz node (regulations).'
  publications:
  - body: assembly
    kind: minutes
    status: configured
    listing_url: https://merishausen.ch/CMS/content?contentid=8711397&language=DE
    from: '2023-06-21'
    to: '2026-06-17'
    how: 'sh_cms, 2 hops: the Gemeindeversammlung node''s Übersicht button group (one labelled button per assembly,
      ''2024-03 Gemeindeversammlung 11.12.2024''), then each file node. Dated by the assembly date in the button
      label or the file title. No minutes are published as files, only the invitations with agenda (Einladung, Traktandenliste).
      Excluded: the Rechnungen and Budgets groups (would carry the CMS publication date) and the usual privacy terms.
      Dry run: 6 invitations 2023-06-21 to 2026-06-17, every date matching its title.'
