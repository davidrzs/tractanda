- bfs_id: 2920
  name: Thayngen
  canton: SH
  status: configured
  website: https://thayngen.ch
  vendor: sh-cms
  reachable: true
  checked: 2026-10-19
  checked_by: crawler dry run (unverified)
  notes: 'Kanton Schaffhausen CMS; the commune has an Einwohnerrat. The broad archive collects the commune''s public
    PDFs from the download lists of the CMS, untagged (linked-sources.yaml). The Einwohnerrat minutes (Protokolle,
    2016-2026) are a kiosk list that the CMS loads from GET /CMS/lists/list; the configuration reads that list (87
    files in one request). Dates come only from the title or the original file name; the year-only Beschlussverzeichnisse
    stay undated. Thayngen publishes versions of the minutes ''ohne Einbürgerungen'' when naturalisations were on
    the agenda: those are taken, and the unmarked twin of 17.03.2022 (Protokoll 2022.03.17.pdf, probably the full
    version) is excluded by name. Not configured: the Gemeinderat page (its list holds only members) and the Interpellationen,
    Motionen and Vergangene Sitzungen lists. robots.txt answers 404 (no rules).'
  publications:
  - body: parliament
    kind: minutes
    status: configured
    listing_url: https://thayngen.ch/CMS/lists/list?filter_customposttypeid_int=101&filter_generic_filetype_string=%28pdf+OR+PDF%29&filter_published_string=published&filter_approvedpaths_string=%2A%2F1845%2F60962%2F60975%2F110405%2F110408%2F111210%2F1223452%2F2257769%2F2289979%2F%2A&filter_language_string=DE&sort=sortable_datetime+desc&rows=200&start=0&mode=list
    from: '2016-03-17'
    to: '2026-08-27'
    how: 'sh_cms kiosk step over the Einwohnerrat Protokolle folder (node 2289979): /CMS/lists/list with the folder''s
      idpath, rows=200, one request. Dry run: 86 documents, 77 Protokolle dated by the session in the title (2016-03-17
      to 2026-08-27, every title date equal to the file-name date where the file name carries one) and 9 yearly
      Beschlussverzeichnisse undated.'
