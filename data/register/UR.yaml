- bfs_id: 1213
  name: Schattdorf
  canton: UR
  status: needs_feature
  website: https://www.schattdorf.ch
  vendor: custom
  reachable: true
  checked: 2026-09-10
  checked_by: listing review
  notes: 'Files under /media/municipality/documents/Gemeindeversammlung/; context: row does not reach the date;
    needs the preceding-text date rule. The broad archive collects the commune''s public PDFs, untagged (linked-sources.yaml).
    Mixed public PDF listings are archived without inferred decision tags.'
  publications:
  - body: assembly
    kind: minutes
    status: needs_feature
    listing_url: https://schattdorf.ch/bewirken/offene-dorfgemeinde
    from: '2024-04-22'
    to: '2026-04-20'
    obstacle: 'context: row tried: 5 Protokoll found (plus 5 Beschlussprotokoll, 5 Botschaft), 0 dated; the anchors
      sit in div.downloads__entry (no tr, li or p anywhere in the section); the date is the h3 in div.downloads__header
      of the same div.downloads; file names are Protokoll_<year>-<n>.pdf'
    how: 'date from the nearest preceding text (context: preceding); selector: div.downloads a[href$=''.pdf''] with
      url_regex /Protokoll_\d{4}-\d+\.pdf$'
