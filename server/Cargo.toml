[package]
name = "opencommune-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Web server for Tractanda: JSON API, MCP and the static front end"
publish = false

[dependencies]
axum = "0.8.9"
getrandom = "0.3"
hmac = "0.13.0"
rig-agent = "0.47"
rig-core = { version = "0.47", features = ["reqwest"] }
rig-rmcp = "0.47"
rmcp = { version = "3.9.0", features = ["server", "macros", "transport-streamable-http-server", "client", "transport-async-rw"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "derive"] }
tokio = { version = "1.54.1", features = ["fs", "macros", "rt-multi-thread", "signal"] }
tokio-stream = "0.1"
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip", "compression-zstd", "trace", "set-header", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
rig-core = { version = "0.47", features = ["test-utils", "reqwest"] }
tokio = { version = "1.54.1", features = ["test-util", "macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
